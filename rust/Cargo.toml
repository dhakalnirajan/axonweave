[package]
name = "axonweave-native"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "axonweave"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"