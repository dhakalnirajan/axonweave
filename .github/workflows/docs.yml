name: Deploy Documentation to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs-site/**','docs/**','.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Node.js 24 LTS
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - working-directory: docs-site
        run: npm install
      - name: Typecheck
        working-directory: docs-site
        run: npm run typecheck
      - name: Lint DESIGN.md design tokens
        working-directory: docs-site
        run: npm run design:lint
      - name: Verify markdown rendering (no raw markdown leaks, links resolve)
        working-directory: docs-site
        run: npm run verify:render
      - name: Build production site
        working-directory: docs-site
        env:
          VITE_BASE_PATH: /axonweave/
        run: npm run build
      - name: Verify build artifacts
        working-directory: docs-site
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          echo "docs build artifacts verified"
      - name: Verify sitemap covers every route
        working-directory: docs-site
        run: |
          node -e "
            const fs = require('fs');
            const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
            const slugs = [...fs.readFileSync('src/main.tsx', 'utf8').matchAll(/\\{slug:'([^']+)'/g)].map(m => m[1]);
            const missing = slugs.filter(s => !sitemap.includes('axonweave/' + (s === 'index' ? '' : s)));
            if (missing.length) { console.error('sitemap missing:', missing); process.exit(1); }
            const dupes = slugs.filter((s, i) => slugs.indexOf(s) !== i);
            if (dupes.length) { console.error('duplicate slugs in registry:', dupes); process.exit(1); }
            console.log('sitemap covers ' + slugs.length + ' routes; no duplicates');
          "
      - name: Deploy dist to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rfq . 2> /dev/null
          cp -r docs-site/dist/. .
          printf 'node_modules/\ndocs-site/\n_dist/\n.sass-cache/\n' > .gitignore
          git add -A
          git commit -m "docs: deploy built site to gh-pages"
          git push --force origin gh-pages