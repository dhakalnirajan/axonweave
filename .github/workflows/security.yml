name: Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # CodeQL for this repository runs via GitHub default setup; an advanced
  # (workflow-based) configuration here would conflict with it and the SARIF
  # upload is rejected ("CodeQL analyses from advanced configurations cannot
  # be processed when the default setup is enabled").
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
